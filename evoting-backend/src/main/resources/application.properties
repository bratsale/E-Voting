# Konekcija ka MariaDB bazi podataka
spring.datasource.url=jdbc:mariadb://localhost:3306/evoting_db
spring.datasource.username=evoting_user
spring.datasource.password=tvoja_lozinka
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate podešavanja
# Pošto smo ručno napravili tabele, stavljamo 'validate' da Hibernate samo provjeri strukturu
spring.jpa.hibernate.ddl-auto=update

# Prikazivanje SQL-a u konzoli (odlično za debugging tokom razvoja)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.web-application-type=servlet
